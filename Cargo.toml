[package]
name = "waypilot"
version = "0.2.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
description = "A controlled MCP execution service built on Wayframe"
repository = "https://github.com/Doout/waypilot"
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "io-std", "signal"] }
tracing = "0.1"
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
toml = "0.8"
subtle = "2"
rand = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
wayframe-codec = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979" }
wayframe-cache = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979" }
wayframe-core = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979" }
wayframe-flow = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979" }
wayframe-transport = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979" }
wayframe-observability = { git = "https://github.com/Doout/wayframe", rev = "2e1ed6f8c6f71e6cc7fdbb9eac38ad5ffba77979", features = ["otel"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
