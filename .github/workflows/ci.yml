name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install independent MCP SDK
        run: python3 -m pip install -r requirements-dev.txt
      - name: Verify
        run: |
          export WAYPILOT_PYTHON="$(command -v python3)"
          bash scripts/verify.sh
      - name: Fixture benchmark
        run: |
          export WAYPILOT_PYTHON="$(command -v python3)"
          cargo run --locked --release -- demo --samples 10 > target/benchmark.json
          python3 demos/mcp_demo.py target/release/waypilot > target/mcp-demo.json
          python3 scripts/benchmark_gateway.py target/release/waypilot --samples 100 > target/gateway-benchmark.json
          python3 demos/agent_demo.py target/release/waypilot --output target/agent-demo.json
          python3 scripts/benchmark_agents.py target/release/waypilot --runs 20 --output target/agent-benchmark.json
      - name: State validation benchmark controls
        run: |
          export WAYPILOT_PYTHON="$(command -v python3)"
          python3 scripts/benchmark_state.py target/release/waypilot \
            --baseline target/release/waypilot --samples 20 \
            > target/state-benchmark.json
      - name: Qualify state invalidation at 1,000 clients
        if: runner.os == 'Linux'
        run: |
          export WAYPILOT_PYTHON="$(command -v python3)"
          python3 load/state_qualify.py target/release/waypilot \
            --clients 1000 --concurrency 500 --output target/state-scale.json
      - name: Qualify 1,000 clients and 500 concurrent calls
        if: runner.os == 'Linux'
        run: |
          python3 load/qualify.py target/release/waypilot \
            --clients 1000 --concurrency 500 --seconds 60 --rate 500 \
            --trace-ratio 0.1 --output target/scale-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            target/benchmark.json
            target/mcp-demo.json
            target/gateway-benchmark.json
            target/scale-smoke.json
            target/scale-qualification.json
            target/state-scale-smoke.json
            target/state-scale.json
            target/state-benchmark.json
            target/agent-demo.json
            target/agent-benchmark.json
